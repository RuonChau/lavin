<svg viewBox="0 0 400 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;display=swap');
      .brand-text-main { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 52px; letter-spacing: 0.05em; }
      .brand-text-sub { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 16px; letter-spacing: 0.3em; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#F9F6F0" />
  
  <g transform="translate(0, -10)">
    <!-- Green Steam (Hơi nóng màu xanh) -->
    <path d="M 170 165 C 155 145, 185 125, 170 105" fill="none" stroke="#6DBE45" stroke-width="8" stroke-linecap="round" />
    <path d="M 200 170 C 180 140, 220 110, 200 80" fill="none" stroke="#6DBE45" stroke-width="10" stroke-linecap="round" />
    <path d="M 230 165 C 215 145, 245 125, 230 105" fill="none" stroke="#6DBE45" stroke-width="8" stroke-linecap="round" />
    
    <!-- Cup Handle -->
    <path d="M 260 195 C 310 195, 310 225, 255 230" fill="none" stroke="#6F4E37" stroke-width="12" stroke-linecap="round" />
    
    <!-- Saucer -->
    <path d="M 110 240 Q 200 265 290 240" fill="none" stroke="#6F4E37" stroke-width="10" stroke-linecap="round" />
    
    <!-- Cappuccino Cup Body -->
    <path d="M 130 180 C 130 250, 270 250, 270 180 Z" fill="#6F4E37" />
    
    <!-- Cup Rim Background -->
    <ellipse cx="200" cy="180" rx="70" ry="12" fill="#F9F6F0" />
    
    <!-- Coffee Surface -->
    <ellipse cx="200" cy="180" rx="60" ry="8" fill="#6F4E37" />
    
    <!-- Leaf Motif on Cup -->
    <path d="M 200 205 C 190 215, 190 225, 200 235 C 210 225, 210 215, 200 205 Z" fill="#F9F6F0" />
  </g>
  
  <!-- Typography -->
  <text x="200" y="325" class="brand-text-main" fill="#6F4E37" text-anchor="middle">LaVin</text>
  <text x="200" y="355" class="brand-text-sub" fill="#6DBE45" text-anchor="middle">CAFE &amp; BINGSU</text>
</svg>